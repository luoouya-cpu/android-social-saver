services:
  social-capture:
    build: .
    container_name: social-capture
    init: true
    ipc: host
    user: pwuser
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      # 请务必将下面的 Token 改成你自己的长随机字符串。
      API_TOKEN: "change-this-to-a-long-random-token"
      MAX_CONCURRENT_CAPTURES: "1"
      MAX_QUEUED_CAPTURES: "8"
      MAX_VIDEO_MB: "200"
      MAX_IMAGE_MB: "30"
